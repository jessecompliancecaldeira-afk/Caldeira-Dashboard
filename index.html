<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding - Caldeira OTC</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F5F5F5; min-height: 100vh; }
  .header { text-align: center; padding: 1.5rem 0 1rem; }
  .header img { height: 65px; object-fit: contain; background: #F5F5F5; padding: 4px 16px; border-radius: 8px; }
  .header p { font-size: 12px; color: #888; margin-top: 6px; letter-spacing: 1px; text-transform: uppercase; }
  .container { max-width: 1000px; margin: 0 auto; padding: 0 1.5rem 3rem; }
  .top-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .bottom-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 1.25rem; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
  .card-label { font-size: 11px; color: #888; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .card-value { font-size: 28px; font-weight: 600; color: #D4674A; }
  .card-value.text { font-size: 15px; line-height: 1.5; color: #1A1A1A; font-weight: 500; }
  .card-value.empty { color: #ccc; font-size: 20px; }
  select { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; background: #fff; color: #1A1A1A; font-size: 14px; cursor: pointer; margin-top: 8px; }
  select:focus { outline: none; border-color: #D4674A; }
  .select-title { font-size: 15px; font-weight: 600; color: #1A1A1A; margin-bottom: 4px; }
  .donut-wrap { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
  .donut-legend { font-size: 12px; color: #666; }
  .donut-legend div { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .table-wrap { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
  .table-title { padding: 14px 16px; font-size: 14px; font-weight: 600; color: #1A1A1A; border-bottom: 1px solid #f0f0f0; background: #fafafa; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #fafafa; color: #888; font-weight: 600; padding: 10px 16px; text-align: left; border-bottom: 1px solid #f0f0f0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  td { padding: 11px 16px; border-bottom: 1px solid #f7f7f7; color: #1A1A1A; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fdf5f2; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-ok { background: #EAF3DE; color: #3B6D11; }
  .badge-late { background: #FCEBEB; color: #A32D2D; }
  .badge-doc-ok { background: #E6F1FB; color: #185FA5; }
  .badge-doc-inc { background: #FAEEDA; color: #854F0B; }
  .empty-state { text-align: center; padding: 2.5rem; color: #aaa; font-size: 14px; }
  .refresh-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .refresh-bar span { font-size: 12px; color: #aaa; }
  .refresh-btn { background: #D4674A; color: #fff; border: none; padding: 7px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 500; }
  .refresh-btn:hover { background: #c05a3f; }
  .summary-chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip { background: #fff; border: 1px solid #e8e8e8; border-radius: 20px; padding: 5px 14px; font-size: 12px; color: #666; font-weight: 500; }
  .chip span { color: #D4674A; font-weight: 700; }
</style>
</head>
<body>

<div class="header">
  <img src="logo_transparent_background (1).png" alt="Caldeira OTC" />
  <p>Dashboard de Onboarding — Compliance</p>
</div>

<div class="container">
  <div class="refresh-bar">
    <div class="summary-chips" id="summaryChips"><div class="chip">Carregando...</div></div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="lastUpdate"></span>
      <button class="refresh-btn" onclick="loadData()">↻ Atualizar</button>
    </div>
  </div>

  <div class="top-row">
    <div class="card">
      <div class="select-title">Selecione o cliente</div>
      <select id="clientSelect"><option value="">Todos os clientes</option></select>
    </div>
    <div class="card">
      <div class="card-label">Etapa atual do onboarding</div>
      <div class="card-value text empty" id="statusAtual">—</div>
    </div>
    <div class="card">
      <div class="card-label">Visão geral</div>
      <div class="donut-wrap">
        <canvas id="donutChart" width="80" height="80"></canvas>
        <div class="donut-legend" id="donutLegend">Carregando...</div>
      </div>
    </div>
  </div>

  <div class="bottom-row">
    <div class="card">
      <div class="card-label">Dias em aberto</div>
      <div class="card-value empty" id="diasAberto">—</div>
    </div>
    <div class="card">
      <div class="card-label">Status da documentação</div>
      <div class="card-value text empty" id="docStatus">—</div>
    </div>
    <div class="card">
      <div class="card-label">Alerta de SLA</div>
      <div id="slaCard" style="margin-top:6px;font-size:20px;color:#ccc;">—</div>
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-title">Onboardings em análise</div>
    <table>
      <thead>
        <tr>
          <th>Empresa</th><th>Recebimento</th><th>Documentação</th>
          <th>Dias em aberto</th><th>Status atual</th><th>SLA</th>
        </tr>
      </thead>
      <tbody id="tableBody"><tr><td colspan="6" style="text-align:center;padding:2rem;color:#aaa;">Carregando...</td></tr></tbody>
    </table>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwyKLIxJLsA3Q91Gng1xJhrweS8Ou1TNsDxvqSGC-hVWaH-lsNofC6DQ7dhBA082QTU/exec';
const COLORS = {'Em análise':'#D4674A','Cliente':'#1A1A1A','Rejeitado':'#888888'};
let allData = [];

function parseDate(val) {
  if (!val) return null;
  if (val instanceof Date) return isNaN(val) ? null : val;
  const s = String(val).trim();
  const p = s.split('/');
  if (p.length === 3) return new Date(parseInt(p[2]), parseInt(p[1])-1, parseInt(p[0]));
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

function daysOpen(dateVal, status) {
  if ((status||'').trim() !== 'Em análise') return null;
  const d = parseDate(dateVal);
  if (!d) return null;
  return Math.floor((new Date() - d) / 86400000);
}

function formatDate(val) {
  const d = parseDate(val);
  if (!d) return val || '—';
  return d.toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric'});
}

function drawDonut(data) {
  const canvas = document.getElementById('donutChart');
  const ctx = canvas.getContext('2d');
  const counts = {};
  data.forEach(r => { const s=(r['Status do Cliente']||'').trim(); if(s) counts[s]=(counts[s]||0)+1; });
  const entries = Object.entries(counts);
  const total = entries.reduce((s,[,v])=>s+v,0);
  if (!total) { document.getElementById('donutLegend').textContent='Sem dados'; return; }
  const cx=40,cy=40,r=34,inner=20;
  ctx.clearRect(0,0,80,80);
  let angle=-Math.PI/2;
  entries.forEach(([k,v])=>{
    const sweep=(v/total)*2*Math.PI;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,angle,angle+sweep); ctx.closePath();
    ctx.fillStyle=COLORS[k]||'#ccc'; ctx.fill(); angle+=sweep;
  });
  ctx.beginPath(); ctx.arc(cx,cy,inner,0,2*Math.PI); ctx.fillStyle='#fff'; ctx.fill();
  document.getElementById('donutLegend').innerHTML=entries.map(([k,v])=>
    '<div><span class="dot" style="background:'+(COLORS[k]||'#ccc')+'"></span>'+k+': '+v+' ('+Math.round(v/total*100)+'%)</div>'
  ).join('');
}

function renderTable(data) {
  const tbody = document.getElementById('tableBody');
  const rows = data.filter(r=>(r['Status do Cliente']||'').trim()==='Em análise');
  if (!rows.length) { tbody.innerHTML='<tr><td colspan="6" class="empty-state">Nenhum onboarding em análise</td></tr>'; return; }
  tbody.innerHTML = rows.map(r => {
    const days = daysOpen(r['Data do recebimento'], r['Status do Cliente']);
    const sla = days===null?'—':days>2?'<span class="badge badge-late">SLA Atrasado</span>':'<span class="badge badge-ok">No prazo</span>';
    const doc=(r['Documentação']||'').trim();
    const docBadge=doc.toLowerCase()==='completa'?'<span class="badge badge-doc-ok">'+doc+'</span>':doc?'<span class="badge badge-doc-inc">'+doc+'</span>':'—';
    return '<tr><td><strong>'+(r['Nome da Empresa']||'—')+'</strong></td><td>'+formatDate(r['Data do recebimento'])+'</td><td>'+docBadge+'</td><td>'+(days!==null?days+' dias':'—')+'</td><td>'+(r['Status atual']||'—')+'</td><td>'+sla+'</td></tr>';
  }).join('');
}

function updateCards(client) {
  const statusEl=document.getElementById('statusAtual'),diasEl=document.getElementById('diasAberto'),docEl=document.getElementById('docStatus'),slaEl=document.getElementById('slaCard');
  if (!client) {
    statusEl.textContent='—'; statusEl.className='card-value text empty';
    diasEl.textContent='—'; diasEl.className='card-value empty';
    docEl.textContent='—'; docEl.className='card-value text empty';
    slaEl.innerHTML='<span style="color:#ccc;font-size:20px;">—</span>'; return;
  }
  const row=allData.find(r=>r['Nome da Empresa']===client);
  if (!row) return;
  const days=daysOpen(row['Data do recebimento'],row['Status do Cliente']);
  statusEl.textContent=row['Status atual']||'—'; statusEl.className='card-value text';
  diasEl.textContent=days!==null?days+' dias':'—'; diasEl.className='card-value';
  docEl.textContent=row['Documentação']||'—'; docEl.className='card-value text';
  slaEl.innerHTML=days===null?'<span style="color:#ccc;font-size:20px;">—</span>':days>2?'<span class="badge badge-late" style="font-size:14px;padding:6px 14px;">⚠ SLA Atrasado</span>':'<span class="badge badge-ok" style="font-size:14px;padding:6px 14px;">✓ No prazo</span>';
}

function updateChips(data) {
  const ana=data.filter(r=>(r['Status do Cliente']||'').trim()==='Em análise').length;
  const fin=data.filter(r=>(r['Status do Cliente']||'').trim()==='Cliente').length;
  const rej=data.filter(r=>(r['Status do Cliente']||'').trim()==='Rejeitado').length;
  const inc=data.filter(r=>(r['Status do Cliente']||'').trim()==='Em análise'&&(r['Documentação']||'').toLowerCase()==='incompleta').length;
  const late=data.filter(r=>{const d=daysOpen(r['Data do recebimento'],r['Status do Cliente']);return d!==null&&d>2;}).length;
  document.getElementById('summaryChips').innerHTML=
    '<div class="chip">Em análise: <span>'+ana+'</span></div>'+
    '<div class="chip">Finalizados: <span>'+fin+'</span></div>'+
    (rej>0?'<div class="chip">Rejeitados: <span>'+rej+'</span></div>':'')+
    '<div class="chip">Doc. incompleta: <span>'+inc+'</span></div>'+
    '<div class="chip">SLA atrasado: <span>'+late+'</span></div>';
}

function populateSelect(data) {
  const sel=document.getElementById('clientSelect');
  sel.innerHTML='<option value="">Todos os clientes</option>';
  [...new Set(data.filter(r=>(r['Status do Cliente']||'').trim()==='Em análise').map(r=>r['Nome da Empresa']))].filter(Boolean).sort().forEach(n=>{
    const opt=document.createElement('option'); opt.value=n; opt.textContent=n; sel.appendChild(opt);
  });
}

document.getElementById('clientSelect').addEventListener('change',function(){
  const v=this.value;
  updateCards(v);
  drawDonut(v?allData.filter(r=>r['Nome da Empresa']===v):allData);
  renderTable(v?allData.filter(r=>r['Nome da Empresa']===v):allData);
});

function loadData() {
  document.getElementById('lastUpdate').textContent='Atualizando...';
  fetch(API_URL).then(r=>r.json()).then(data=>{
    allData=data.filter(r=>r['Nome da Empresa']&&String(r['Nome da Empresa']).trim()!=='');
    populateSelect(allData); renderTable(allData); drawDonut(allData); updateChips(allData);
    const now=new Date();
    document.getElementById('lastUpdate').textContent='Atualizado às '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }).catch(()=>{
    document.getElementById('tableBody').innerHTML='<tr><td colspan="6" class="empty-state">Erro ao carregar dados.</td></tr>';
    document.getElementById('lastUpdate').textContent='Erro ao atualizar';
  });
}
loadData();
</script>
</body>
</html>
